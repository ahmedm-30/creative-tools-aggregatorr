  <main id="main">
    <main id="main">
  <section class="form-container">
    <h2>Create an account</h2>
    <p>Sign up to save your favourite tools and reviews.</p>

    <form id="signupForm" novalidate>
      <div class="form-group">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" name="fullName" required placeholder="Your name">
      </div>

      <div class="form-group">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" name="email" required placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" name="password" required placeholder="At least 8 characters">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Repeat your password">
      </div>

      <div class="form-group">
        <label for="role">I am mainly a...</label>
        <select id="role" name="role">
          <option value="student">Student</option>
          <option value="designer">Designer</option>
          <option value="developer">Developer</option>
          <option value="creator">Content creator</option>
        </select>
      </div>

      <button type="submit" class="btn-primary">Sign Up</button>
      <p id="signupMsg" class="form-message"></p>
    </form>
  </section>
</main>
